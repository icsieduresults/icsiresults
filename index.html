<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS Executive Results</title><style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:20px;
}

.box{
background:white;
max-width:700px;
margin:auto;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

input{
width:95%;
padding:10px;
margin:10px 0;
}

button{
padding:10px 20px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th,td{
border:1px solid #999;
padding:8px;
}

th{
background:#f0f0f0;
}
</style></head><body><div class="box"><h2>Company Secretaries (CS) Examination Results</h2><input id="hall" placeholder="Hall Ticket Number"><input id="dob" placeholder="DOB (DD-MM-YYYY)"><br><br>

<button onclick="verify()">Verify</button>

<div id="result"></div></div><script>

function verify(){

let hall =
document.getElementById("hall").value.trim();

let dob =
document.getElementById("dob").value.trim();

if(hall === "541571" && dob === "12-02-2004"){

document.getElementById("result").innerHTML = `
<h3 style="color:green;">✅ Verification Successful</h3>

<img src="result.jpg" style="width:100%;margin-top:15px;">
`;
}else{

document.getElementById("result").innerHTML =
"❌ Invalid Hall Ticket Number or DOB";

}

}

</script></body>
</html>
